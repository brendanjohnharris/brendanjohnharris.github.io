name: Hugo build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # CurriculumVitae lives under static/cv
          fetch-depth: 0          # full history for Hugo's enableGitInfo

      - name: Update CurriculumVitae submodule to latest
        run: git submodule update --remote --merge CurriculumVitae

      - name: Sync palette from Fathom.jl
        run: |
          curl -fsSL https://raw.githubusercontent.com/brendanjohnharris/Fathom.jl/main/test/colors.yaml \
            -o data/colors.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications from ORCID
        run: |
          pip install requests pyyaml
          python scripts/fetch_publications.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
